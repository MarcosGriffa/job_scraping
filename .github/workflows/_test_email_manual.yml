# Workflow TEMPORAL, solo para verificar de punta a punta que Resend manda
# mails de verdad con la configuración actual. Se borra apenas se confirma
# (ver notificaciones_semanales.py para el workflow real, que queda).
name: "[TEMPORAL] Prueba de envío de mail"

on:
  workflow_dispatch: {}

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Mandar mail de prueba
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: "https://jobscraping.vercel.app"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -c "
          from api.emailer import enviar_resumen_semanal
          ofertas = [
              {'title': 'Analista de Datos Junior (PRUEBA)', 'company': 'Empresa de prueba', 'location': 'CABA', 'score': 88, 'url': 'https://jobscraping.vercel.app/resultados'},
              {'title': 'Desarrollador Python (PRUEBA)', 'company': 'Otra empresa de prueba', 'location': 'Remoto', 'score': 76, 'url': 'https://jobscraping.vercel.app/resultados'},
          ]
          enviar_resumen_semanal('marquitosgriffa@gmail.com', 'Marcos', ofertas)
          print('ENVIADO OK')
          "
